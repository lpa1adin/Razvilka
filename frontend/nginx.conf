server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Наружу проксируем только /api; /metrics и /docs бэкенда остаются во внутренней сети.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;   # потоковые ответы Claude (этап 4)
    proxy_buffering off;
  }

  # Песочница для кода ученика: открывается в iframe с sandbox (своё пустое происхождение).
  # Скрипты страницы ученика разрешены, любые сетевые запросы — нет.
  location = /sandbox.html {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; frame-ancestors 'self'";
  }

  # Python в браузере (Pyodide): ~12 МБ, меняется только с обновлением платформы
  location /pyodide/ {
    expires 7d;
    add_header Cache-Control "public";
    types { application/wasm wasm; text/javascript mjs; application/json json; application/zip zip; }
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; img-src 'self' data: https://raw.githubusercontent.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'";
  }
}
